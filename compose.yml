services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturacion_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - facturacion_network

  db:
    image: postgres:16-alpine
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facturacion"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - facturacion_network

networks:
  facturacion_network:

volumes:
  postgres_data:
  vendor_data:

